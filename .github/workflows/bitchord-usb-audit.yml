name: BitChord USB Audit (Dev APK)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Apply diagnostic patch
        run: git apply BitChord_USB_diagnostic-1.patch
      - name: Build development debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDevDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-USB-Audit-Dev-Debug
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
